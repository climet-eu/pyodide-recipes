package:
  name: h5py
  version: 3.15.1
  top-level:
    - h5py
source:
  url: https://files.pythonhosted.org/packages/source/h/h5py/h5py-3.15.1.tar.gz
  sha256: c86e3ed45c4473564de55aa83b6fc9e5ead86578773dfbd93047380042e26b69
  patches:
    - patches/0001-Fix-incompatible-pointer-type.patch
    - patches/configure.patch
about:
  home: https://github.com/h5py/h5py
  PyPI: https://pypi.org/project/h5py
  summary: Read and write HDF5 files from Python
  license: BSD-3-Clause

requirements:
  host:
    - numpy
    - libhdf5

build:
  vendor-sharedlib: true
  exports: requested
  script: |
    export HDF5_MPI=OFF
    export H5PY_SETUP_REQUIRES="0"
    export HDF5_VERSION=1.14.3
    export HDF5_DIR=${WASM_LIBRARY_DIR}
