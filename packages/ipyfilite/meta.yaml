package:
  name: ipyfilite
  version: 0.1.30
  top-level:
    - ipyfilite
source:
  url: https://files.pythonhosted.org/packages/py3/i/ipyfilite/ipyfilite-0.1.30-py3-none-any.whl
  sha256: 18bcddf421a1dda62e6b375c25d42baf79c8951d940b90b230fa6b7000d0bde1
build:
  post: |
    patch -p1 </src/pyodide-recipes/packages/ipyfilite/patches/0001-nodejs-import.patch
    patch -p1 </src/pyodide-recipes/packages/ipyfilite/patches/0002-downloadfs-chmod.patch
about:
  home: https://github.com/juntyr/ipyfilite
  PyPI: https://pypi.org/project/ipyfilite
