package:
  name: libmir
  version: 1.29.0

source:
  url: https://github.com/ecmwf/mir/archive/refs/tags/1.29.0.tar.gz
  sha256: 448f84fa8035c5215480392d0147263b99b79eda8a200e62d8ec54d21783d116
  patches:
    - patches/0002-const-buffer-size.patch
    - patches/0003-no-tools.patch

requirements:
  host:
    - libatlas
    - libeccodes
    - libeckit

build:
  type: shared_library
  script: |
    git clone --branch 3.15.0 --depth 1 https://github.com/ecmwf/ecbuild;
    cd ecbuild && git apply ../../../patches/0001-ecbuild-math-escape.patch && cd ..;

    mkdir -p build;

    export CFLAGS="${CFLAGS} -fwasm-exceptions -sSUPPORT_LONGJMP='wasm'"
    export CXXFLAGS="${CXXFLAGS} -fwasm-exceptions -sSUPPORT_LONGJMP='wasm'"
    export LDFLAGS="${LDFLAGS} -fwasm-exceptions -sSUPPORT_LONGJMP='wasm'"

    export EMSCRIPTEN_SYSROOT=$(em-config CACHE)/sysroot
    export EMSCRIPTEN_INCLUDE=$EMSCRIPTEN_SYSROOT/include
    export EMSCRIPTEN_BIN=$EMSCRIPTEN_SYSROOT/bin
    export EMSCRIPTEN_LIB=$EMSCRIPTEN_SYSROOT/lib/wasm32-emscripten/pic

    embuilder build libpng-legacysjlj --pic

    cd build \
        && emcmake cmake ../ \
        -DCMAKE_INSTALL_PREFIX=${WASM_LIBRARY_DIR} \
        -DBUILD_SHARED_LIBS=ON \
        -DDISABLE_OS_CHECK=ON \
        -DENABLE_TESTS=OFF \
        -DENABLE_BUILD_TOOLS=OFF \
        -DENABLE_PNG=ON \
        -DPNG_PNG_INCLUDE_DIR=$EMSCRIPTEN_INCLUDE \
        -DPNG_LIBRARY_RELEASE=$EMSCRIPTEN_LIB/libpng-legacysjlj.a \
        -DCMAKE_C_FLAGS="-fwasm-exceptions" \
        -DCMAKE_CXX_FLAGS="-fwasm-exceptions";

    emmake make -j ${PYODIDE_JOBS:-3};
    emmake make -j ${PYODIDE_JOBS:-3} install;

    cp -P ${WASM_LIBRARY_DIR}/lib/libmir.so ${DISTDIR}
