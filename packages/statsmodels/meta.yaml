package:
  name: statsmodels
  version: 0.15.0
  top-level:
    - statsmodels
source:
  url: https://files.pythonhosted.org/packages/source/s/statsmodels/statsmodels-0.15.0.tar.gz
  sha256: 5d257fe58d0772bc46a557880ca78e2a8e07fec7bfd9d11074aef8e33e1aecbc

build:
  ldflags: |
    -L$(NUMPY_LIB)/core/lib/
    -L$(NUMPY_LIB)/random/lib/
  unvendor-tests: false # for better testing
requirements:
  host:
    - numpy
    - scipy

test:
  imports:
    - statsmodels
    - statsmodels.api
about:
  home: https://www.statsmodels.org/
  PyPI: https://pypi.org/project/statsmodels
  summary: Statistical computations and models for Python
  license: BSD-3-Clause

extra:
  recipe-maintainers:
    - agriyakhetarpal
